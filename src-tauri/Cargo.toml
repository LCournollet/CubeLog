[package]
name = "cubelog"
version = "0.1.0"
description = "CubeLog — chronomètre de speedcubing local (Stackmat via micro)"
authors = ["CubeLog"]
edition = "2021"
rust-version = "1.77"

# Bibliothèque consommée par le binaire (modèle Tauri 2).
[lib]
name = "cubelog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
